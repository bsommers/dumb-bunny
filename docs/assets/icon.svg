<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Operation Dumb Bunny Identity Disc Icon">
  <defs>
    <radialGradient id="disc-bg" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0b1a36" />
      <stop offset="100%" stop-color="#050914" />
    </radialGradient>
    <linearGradient id="ring-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="55%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#d48ba8" />
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.8" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#disc-bg)" />
  <circle cx="32" cy="32" r="27" fill="none" stroke="url(#ring-cyan)" stroke-width="2.5" filter="url(#glow)" />
  <circle cx="32" cy="32" r="21" fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1" stroke-dasharray="4 3" />
  <!-- Stylized Floppy Bionic Bunny Silhouette -->
  <ellipse cx="18" cy="23" rx="8.5" ry="4.2" transform="rotate(-24 18 23)" fill="#d48ba8" fill-opacity="0.85" stroke="#00e5ff" stroke-width="1.2" />
  <ellipse cx="46" cy="23" rx="8.5" ry="4.2" transform="rotate(24 46 23)" fill="#d48ba8" fill-opacity="0.85" stroke="#00e5ff" stroke-width="1.2" />
  <circle cx="32" cy="34" r="12.5" fill="#0b1428" stroke="#00e5ff" stroke-width="2" />
  <ellipse cx="32" cy="35" rx="9" ry="8" fill="#c5a179" fill-opacity="0.9" />
  <!-- Side-glancing blue bionic eyes -->
  <circle cx="27.5" cy="34" r="2.1" fill="#366687" />
  <circle cx="36.5" cy="34" r="2.1" fill="#366687" />
  <circle cx="26.9" cy="33.4" r="0.7" fill="#ffffff" />
  <circle cx="35.9" cy="33.4" r="0.7" fill="#ffffff" />
  <!-- Pink button nose -->
  <ellipse cx="32" cy="37.2" rx="1.8" ry="1.2" fill="#944536" />
  <!-- Symmetry midline laser -->
  <line x1="32" y1="18" x2="32" y2="48" stroke="#00ff9d" stroke-opacity="0.55" stroke-width="0.9" stroke-dasharray="2 2" />
</svg>
